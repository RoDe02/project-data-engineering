[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-batch-platform"
version = "1.0.0"
description = "Reproducible UCI Twitter geospatial batch data platform"
requires-python = ">=3.10,<3.13"
dependencies = ["boto3==1.35.99", "requests==2.32.3"]

[project.optional-dependencies]
dev = ["ruff==0.17.4"]

[project.scripts]
twitter-ingest = "dataflow.daily:main"
twitter-verify = "dataflow.verify:main"

[tool.setuptools.packages.find]
include = ["dataflow*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "ANN", "UP", "PLC0415"]
# Boto3 clients and heterogeneous JSON documents have dynamic interfaces.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
