apiVersion: v1
kind: ConfigMap
metadata: {name: platform-settings, namespace: twitter-data}
data:
  S3_ENDPOINT: http://minio.twitter-data.svc.cluster.local:9000
  AWS_DEFAULT_REGION: us-east-1
  S3_VERIFY_TLS: "false"
  MIN_AGG_COUNT: "5"
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: data-ingest, namespace: twitter-data}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: airflow-orchestrator, namespace: twitter-data}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: airflow-orchestrator, namespace: twitter-data}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [sparkoperator.k8s.io]
    resources: [sparkapplications, sparkapplications/status]
    verbs: [get, list, watch, create, delete, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: airflow-orchestrator, namespace: twitter-data}
subjects:
  - {kind: ServiceAccount, name: airflow-orchestrator, namespace: twitter-data}
roleRef: {kind: Role, name: airflow-orchestrator, apiGroup: rbac.authorization.k8s.io}
