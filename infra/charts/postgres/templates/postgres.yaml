apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  labels: {app: airflow-postgres}
spec:
  selector: {app: airflow-postgres}
  ports:
    - {port: 5432, targetPort: 5432, name: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgres
spec:
  serviceName: airflow-postgres
  replicas: 1
  selector:
    matchLabels: {app: airflow-postgres}
  template:
    metadata:
      labels: {app: airflow-postgres}
    spec:
      securityContext: {fsGroup: 999}
      containers:
      - name: postgres
        image: {{ .Values.image | quote }}
        ports: [{name: postgres, containerPort: 5432}]
        env:
          - {name: POSTGRES_USER, value: admin}
          - {name: POSTGRES_DB, value: airflow}
          - {name: POSTGRES_PASSWORD, value: admin}
          - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        readinessProbe:
          exec: {command: ["/bin/sh", "-ec", "pg_isready -U admin -d airflow"]}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec: {command: ["/bin/sh", "-ec", "pg_isready -U admin -d airflow"]}
          initialDelaySeconds: 45
          periodSeconds: 30
        resources:
{{ toYaml .Values.resources | indent 10 }}
        volumeMounts:
          - {name: pgdata, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.persistence.size | quote }}}
